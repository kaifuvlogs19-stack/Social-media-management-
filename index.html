<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flex Kaif — AI Content OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100%;background:#08080E;color:#EEEEFF;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:#0D0D15}
::-webkit-scrollbar-thumb{background:#FF4500;border-radius:2px}
.sg{font-family:'Space Grotesk',sans-serif}

/* LAYOUT */
#shell{display:flex;height:100vh;overflow:hidden}
#sidebar{width:230px;min-width:230px;background:#0D0D15;border-right:1px solid #1A1A28;display:flex;flex-direction:column;transition:width .2s;overflow:hidden;position:relative;z-index:30}
#sidebar.mini{width:62px;min-width:62px}
#sidebar.mini .hide-mini{display:none!important}
#sidebar.mini .nav-btn{justify-content:center;padding:10px 0}
#work{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#topbar{height:58px;background:#0D0D15;border-bottom:1px solid #1A1A28;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;gap:12px}
#scroller{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px}
.wrap{max-width:1160px;margin:0 auto}

/* SIDEBAR */
.logo-row{padding:18px 14px 14px;border-bottom:1px solid #1A1A28;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-ico{width:34px;height:34px;min-width:34px;border-radius:9px;background:linear-gradient(135deg,#FF4500,#FF8C00);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo-name{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;white-space:nowrap;color:#EEEEFF}
.logo-sub{font-size:10px;color:#44446A;white-space:nowrap}
#tog{margin-left:auto;background:none;border:none;cursor:pointer;color:#44446A;padding:4px;display:flex;flex-shrink:0}
.nav-section{padding:10px 8px;overflow-y:auto;flex:1}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;cursor:pointer;color:#66668A;font-size:13px;font-weight:500;margin-bottom:1px;border:1px solid transparent;transition:all .15s;user-select:none;width:100%}
.nav-btn:hover{background:rgba(255,255,255,.04);color:#EEEEFF}
.nav-btn.on{background:rgba(255,69,0,.13);color:#FF5520;border-color:rgba(255,69,0,.22)}
.nav-ico{width:17px;height:17px;flex-shrink:0}
.prof-row{padding:10px 8px;border-top:1px solid #1A1A28;flex-shrink:0}
.prof-inner{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px}
.ava{width:28px;height:28px;min-width:28px;border-radius:50%;background:linear-gradient(135deg,#FF4500,#FF8C00);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}

/* TOPBAR */
.page-ttl{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:#EEEEFF;white-space:nowrap}
.ai-pill{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:7px;background:rgba(0,200,150,.09);border:1px solid rgba(0,200,150,.18);white-space:nowrap}
.ai-dot{width:6px;height:6px;border-radius:50%;background:#00D4AA;animation:blink 1.6s infinite}
.ai-lbl{font-size:11px;color:#00D4AA;font-weight:500}
.top-ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FF4500,#FF8C00);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}

/* PAGES */
.pg{display:none}
.pg.show{display:block}
.vstack{display:flex;flex-direction:column;gap:22px}

/* CARDS */
.card{background:#111119;border:1px solid #1A1A28;border-radius:14px;padding:20px;transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(255,69,0,.22);transform:translateY(-1px)}
.card-flat{background:#111119;border:1px solid #1A1A28;border-radius:14px;padding:20px}
.card-accent{background:linear-gradient(135deg,rgba(255,69,0,.12),rgba(255,140,0,.06),transparent);border:1px solid rgba(255,69,0,.22);border-radius:16px;padding:22px 26px}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g3,.g4{grid-template-columns:1fr}}

/* TYPOGRAPHY */
.lbl{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#44446A}
.h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#EEEEFF;line-height:1.2}
.h2{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#EEEEFF}
.h3{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:#EEEEFF}
.sub{font-size:13px;color:#66668A}
.num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;transition:all .18s;border:none;white-space:nowrap;padding:9px 18px}
.btn:disabled{opacity:.45;cursor:not-allowed!important;transform:none!important}
.btn-p{background:linear-gradient(135deg,#FF4500,#FF6020);color:#fff}
.btn-p:hover:not(:disabled){background:linear-gradient(135deg,#FF5520,#FF7030);box-shadow:0 3px 18px rgba(255,69,0,.38);transform:translateY(-1px)}
.btn-s{background:rgba(255,69,0,.11);color:#FF5520;border:1px solid rgba(255,69,0,.28)!important}
.btn-s:hover{background:rgba(255,69,0,.2)}
.btn-g{background:transparent;color:#66668A;border:1px solid #1A1A28!important;font-family:'Inter',sans-serif;font-weight:500}
.btn-g:hover{background:rgba(255,255,255,.04);color:#EEEEFF}
.btn-yt{background:linear-gradient(135deg,#FF0000,#CC0000);color:#fff}
.btn-yt:hover:not(:disabled){box-shadow:0 3px 16px rgba(255,0,0,.38);transform:translateY(-1px)}
.btn-ig{background:linear-gradient(135deg,#C13584,#833AB4);color:#fff}
.btn-ig:hover:not(:disabled){box-shadow:0 3px 16px rgba(193,53,132,.4);transform:translateY(-1px)}
.btn-sm{padding:6px 12px;font-size:12px}

/* TAGS */
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:18px;font-size:11px;font-weight:600;font-family:'Space Grotesk',sans-serif;white-space:nowrap}
.t-fire{background:rgba(255,69,0,.14);color:#FF6030;border:1px solid rgba(255,69,0,.24)}
.t-gold{background:rgba(255,184,0,.13);color:#FFB800;border:1px solid rgba(255,184,0,.24)}
.t-green{background:rgba(0,212,170,.11);color:#00D4AA;border:1px solid rgba(0,212,170,.2)}
.t-blue{background:rgba(79,142,247,.11);color:#4F8EF7;border:1px solid rgba(79,142,247,.2)}
.t-purple{background:rgba(160,100,255,.11);color:#A064FF;border:1px solid rgba(160,100,255,.2)}
.t-muted{background:rgba(80,80,120,.18);color:#66668A;border:1px solid rgba(80,80,120,.28)}
.t-red{background:rgba(255,60,60,.1);color:#FF6060;border:1px solid rgba(255,60,60,.2)}

/* STATUS */
.st{display:inline-flex;align-items:center;padding:3px 9px;border-radius:18px;font-size:11px;font-weight:600;font-family:'Space Grotesk',sans-serif;white-space:nowrap}
.s-idea{background:rgba(80,80,120,.18);color:#66668A;border:1px solid rgba(80,80,120,.28)}
.s-script{background:rgba(79,142,247,.11);color:#4F8EF7;border:1px solid rgba(79,142,247,.22)}
.s-recording{background:rgba(255,184,0,.12);color:#FFB800;border:1px solid rgba(255,184,0,.24)}
.s-editing{background:rgba(160,100,255,.11);color:#A064FF;border:1px solid rgba(160,100,255,.22)}
.s-ready{background:rgba(0,212,170,.11);color:#00D4AA;border:1px solid rgba(0,212,170,.2)}
.s-published{background:rgba(255,69,0,.12);color:#FF6030;border:1px solid rgba(255,69,0,.22)}

/* INPUTS */
.inp{background:#0A0A12;border:1px solid #1A1A28;border-radius:9px;padding:11px 14px;color:#EEEEFF;font-family:'Inter',sans-serif;font-size:13px;width:100%;outline:none;transition:border-color .18s}
.inp:focus{border-color:rgba(255,69,0,.5);box-shadow:0 0 0 3px rgba(255,69,0,.07)}
.inp::placeholder{color:#44446A}
select.inp option{background:#111119;color:#EEEEFF}
textarea.inp{resize:vertical;min-height:76px;line-height:1.6}

/* PROGRESS */
.prg{height:4px;background:#1A1A28;border-radius:2px;overflow:hidden;width:100%}
.prg-f{height:100%;border-radius:2px;transition:width 1s ease}

/* SECTION HEAD */
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:10px}

/* ROW ITEMS */
.row-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#111119;border:1px solid #1A1A28;border-radius:11px;transition:all .15s;flex-wrap:wrap}
.row-item:hover{border-color:rgba(255,69,0,.22);background:#13131C}

/* COPY BTN */
.cbtn{background:transparent;border:1px solid #1A1A28;border-radius:7px;padding:5px 10px;color:#66668A;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .14s;font-family:'Inter',sans-serif;white-space:nowrap}
.cbtn:hover{background:rgba(255,255,255,.04);color:#EEEEFF}

/* TABS */
.tab-bar{display:flex;gap:3px;background:#0D0D15;border-radius:10px;padding:3px;width:fit-content;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;background:transparent;color:#66668A;transition:all .14s;white-space:nowrap}
.tab.on{background:rgba(255,69,0,.15);color:#FF5520}
.tab-pane{display:none}
.tab-pane.on{display:block;animation:fadeIn .2s ease}

/* CHAT */
.chat-box{height:380px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;animation:slideUp .28s ease}
.msg.me{flex-direction:row-reverse}
.msg-ava{width:30px;height:30px;min-width:30px;border-radius:50%;background:linear-gradient(135deg,#4F8EF7,#8B5CF6);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bubble{max-width:80%;padding:11px 14px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.b-ai{background:rgba(255,255,255,.04);border:1px solid #1A1A28;border-radius:4px 13px 13px 13px;color:#EEEEFF}
.b-me{background:linear-gradient(135deg,rgba(255,69,0,.22),rgba(255,140,0,.12));border:1px solid rgba(255,69,0,.2);border-radius:13px 4px 13px 13px;color:#EEEEFF}
.chat-inp-row{padding:10px 18px 18px;display:flex;gap:9px}
.sugg-row{padding:0 18px 10px;display:flex;flex-wrap:wrap;gap:6px}

/* LOADER */
.loader{display:flex;align-items:center;gap:10px;padding:10px 0;color:#66668A;font-size:13px}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid #1A1A28;border-top-color:#FF4500;animation:spin .75s linear infinite;flex-shrink:0}
.loader-txt::after{content:'▋';animation:blink .55s infinite;color:#FF4500}

/* RING */
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.ring-lbl{font-size:10px;color:#44446A}

/* BAR CHART */
.barchart{display:flex;align-items:flex-end;gap:5px;width:100%}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.barfill{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:height .9s ease}
.barlbl{font-size:9px;color:#44446A;white-space:nowrap}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-hdr{text-align:center;padding:4px 0}
.cal-hdr .day-name{font-size:9px;color:#44446A;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.cal-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:12px;font-weight:600;cursor:pointer;transition:all .13s}
.cal-num:hover{background:rgba(255,69,0,.15);color:#FF5520}
.cal-num.today{background:#FF4500;color:#fff}
.cal-cell{min-height:100px;border-radius:9px;border:1px dashed #1A1A28;padding:5px;overflow:hidden}
.cal-event{border-radius:6px;padding:6px 8px;margin-bottom:4px;cursor:pointer;transition:all .13s}
.cal-event:hover{transform:translateY(-1px)}

/* MILESTONE */
.ms-row{display:flex;align-items:center;gap:12px;padding:13px;background:rgba(255,255,255,.02);border:1px solid #1A1A28;border-radius:11px;margin-bottom:7px}

/* COACH */
.coach-opt{padding:9px 14px;border-radius:9px;border:1px solid #1A1A28;background:transparent;color:#66668A;cursor:pointer;font-size:13px;font-weight:500;font-family:'Space Grotesk',sans-serif;transition:all .14s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.coach-opt.on{border-color:rgba(255,69,0,.35);background:rgba(255,69,0,.11);color:#FF5520}

/* RESULT */
.res-sec{border-left:3px solid #FF4500;padding-left:13px;margin-bottom:14px}

/* ANIMATIONS */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ringGlow{0%,100%{filter:drop-shadow(0 0 5px currentColor)}50%{filter:drop-shadow(0 0 12px currentColor)}}
.aup{animation:slideUp .35s ease both}

/* TIP BOX */
.tip{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:11px}

/* DIVIDER */
.div{height:1px;background:#1A1A28;margin:6px 0}

/* FLEX HELPERS */
.flex{display:flex;align-items:center}
.flex-wrap{display:flex;flex-wrap:wrap}
.gap6{gap:6px}
.gap8{gap:8px}
.gap10{gap:10px}
.gap12{gap:12px}
.gap14{gap:14px}
.gap16{gap:16px}
.jcsb{justify-content:space-between}
.col{flex-direction:column}
.f1{flex:1;min-width:0}
</style>
</head>
<body>
<div id="shell">

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="logo-row">
    <div class="logo-ico">🔥</div>
    <div class="hide-mini">
      <div class="logo-name">Flex Kaif</div>
      <div class="logo-sub">AI Content OS</div>
    </div>
    <button id="tog" onclick="toggleSB()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>
  <div class="nav-section">
    <button class="nav-btn on" data-pg="dashboard" onclick="go('dashboard',this)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span class="hide-mini">Dashboard</span>
    </button>
    <button class="nav-btn" data-pg="ideas" onclick="go('ideas',this)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span class="hide-mini">Idea Generator</span>
    </button>
    <button class="nav-btn" data-pg="instagram" onclick="go('instagram',this)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span class="hide-mini">Instagram Reels</span>

    <button class="nav-btn" data-pg="youtube" onclick="go('youtube',this)">

      <span class="hide-mini">YouTube Studio</span>
    </button>
    <button class="nav-btn" data-pg="calendar" onclick="go('calendar',this)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
      <span class="hide-mini">Content Calendar</span>
    </button>
    <button class="nav-btn" data-pg="manager" onclick="go('manager',this)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="9" cy="16" r="1" fill="currentColor"/><circle cx="15" cy="16" r="1" fill="currentColor"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <span class="hide-mini">AI Manager</span>
    </button>
    <button class="nav-btn" data-pg="analytics" onclick="go('analytics',this)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="hide-mini">Analytics</span>
    </button>
    <button class="nav-btn" data-pg="coach" onclick="go('coach',this)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-1a2 2 0 012-2h16a2 2 0 012 2v1a2 2 0 01-2 2h-2"/><rect x="6" y="18" width="12" height="4"/></svg>
      <span class="hide-mini">AI Coach</span>
    </button>
    <button class="nav-btn" data-pg="monetize" onclick="go('monetize',this)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 6v2m0 8v2M9 10h6M9 14h6"/></svg>
      <span class="hide-mini">Monetization</span>
    </button>
  </div>
  <div class="prof-row">
    <div class="prof-inner">
      <div class="ava">K</div>
      <div class="hide-mini" style="overflow:hidden">
        <div style="font-size:12px;font-weight:600;white-space:nowrap;color:#EEEEFF">flex_kaif</div>
        <div style="font-size:10px;color:#44446A;white-space:nowrap">Digital Creator</div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN WORK AREA -->
<div id="work">
  <div id="topbar">
    <div class="page-ttl" id="ptitle">Dashboard</div>
    <div class="flex gap10">
      <div class="ai-pill">
        <div class="ai-dot"></div>
        <span class="ai-lbl">Claude AI Online</span>
      </div>
      <div class="top-ava">K</div>
    </div>
  </div>
  <div id="scroller">

<!-- ============================================================
     DASHBOARD
============================================================ -->
<div id="pg-dashboard" class="pg show">
<div class="wrap vstack">

  <!-- Hero -->
  <div class="card-accent flex jcsb gap16" style="flex-wrap:wrap">
    <div>
      <div class="lbl" style="margin-bottom:8px">🔥 June 2026 · GMT+05:30</div>
      <div class="h1">Ready to go viral, <span style="color:#FF5520">Kaif</span>? 💪</div>
      <div class="sub" style="margin-top:8px">Instagram: <strong style="color:#FFB800">43,886 views</strong> · <strong style="color:#00D4AA">2,944 interactions</strong> · Viral window: <strong style="color:#FF5520">6–8 PM today</strong></div>
    </div>
    <div id="hero-ring"></div>
  </div>

  <!-- Stat Cards -->
  <div class="g4">
